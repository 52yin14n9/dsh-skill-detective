name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  # `contents: write` is required by the release step below; npm publishing
  # itself only needs the id-token for provenance.
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const p = JSON.parse(fs.readFileSync("package.json", "utf8")); const expected = `v${p.version}`; if (process.env.RELEASE_TAG !== expected) { console.error(`Release tag ${process.env.RELEASE_TAG} does not match ${expected}`); process.exit(1); }'

      - name: Run regression tests
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
